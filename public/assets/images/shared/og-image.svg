<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F5" />
      <stop offset="100%" stop-color="#EFECE6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6E3DC" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6" />

  <!-- Outer frame border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#DEDAD2" stroke-width="1.5" />

  <!-- Corner markings -->
  <path d="M 24 50 L 24 24 L 50 24" fill="none" stroke="#8B6F4E" stroke-width="2" />
  <path d="M 1150 24 L 1176 24 L 1176 50" fill="none" stroke="#8B6F4E" stroke-width="2" />
  <path d="M 24 580 L 24 606 L 50 606" fill="none" stroke="#8B6F4E" stroke-width="2" />
  <path d="M 1150 606 L 1176 606 L 1176 580" fill="none" stroke="#8B6F4E" stroke-width="2" />

  <!-- Content -->
  <g transform="translate(600, 315)">
    <!-- Category Badge -->
    <text x="0" y="-50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#8B6F4E" text-transform="uppercase">Brand Manager Portfolio</text>
    
    <!-- Title -->
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="37.5" font-weight="400" fill="#191919">Akshita Bijalwan — Portfolio</text>
    
    <!-- Label -->
    <text x="0" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="1.5" fill="#747474">Open Graph Social Preview</text>
    
    <!-- Practice areas -->
    <rect x="-160" y="80" width="320" height="28" rx="2" fill="#E8E4DC" />
    <text x="0" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="1" fill="#747474">BRAND STRATEGY · PRODUCT DEVELOPMENT</text>
  </g>

  <!-- Dimensions Indicator bottom-right -->
  <text x="1160" y="592" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#A09B90">1200 × 630</text>
</svg>
